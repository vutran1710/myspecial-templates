name: Validate themes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Built theme files are up to date
        run: node tools/build.mjs --check

      - name: Contribution rules
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node tools/check-paths.mjs "$BASE_SHA" "$AUTHOR"

      # The same validator the MySpecial platform runs on every upload.
      # (After merge, the platform also runs its end-to-end browser tests.)
      - name: Validate all themes
        run: |
          files=$(git ls-files '*/theme.html')
          node tools/myspecial-theme.mjs validate $files
